<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">다음 작업에 다시 쓰는 개인 지식</title>
<desc id="desc">Synthetic example. A source supports a claim compiled into a knowledge page. An artifact is derived from that page and guided by a procedure. Humans inspect evidence and agents read the same contract. Usage relations require recorded evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40796f"/></marker></defs>
