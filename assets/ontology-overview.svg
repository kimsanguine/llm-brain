<text x="54" y="60" font-size="15" letter-spacing="3" fill="#40796f">LLM-BRAIN / PERSONAL KNOWLEDGE ONTOLOGY</text>
<text x="54" y="119" font-family="Noto Serif KR, Apple SD Gothic Neo, serif" font-size="40">근거를 확인하고, 다음 작업에 다시 쓰세요.</text>
<text x="54" y="156" font-size="18" fill="#52635d">원문 · 저장된 주장 상태 · 절차 · 결과물의 관계를 같은 계약으로 읽습니다.</text>
