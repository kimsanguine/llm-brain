<g font-size="24" font-family="Noto Serif KR, Apple SD Gothic Neo, serif"><text x="76" y="283">원문 메모</text><text x="462" y="283">저장된 주장</text><text x="848" y="283">출처 확인 지식</text><text x="462" y="490">출처 확인 절차</text><text x="848" y="490">다음 강의안 초안</text></g>
<g font-size="16" fill="#52635d"><text x="76" y="322">원문 경로 + SHA-256</text><text x="462" y="312" font-size="13">검색 결과의 출처를</text><text x="462" y="334" font-size="13">확인해야 한다</text><text x="848" y="322">slug + 다른 페이지 연결</text><text x="462" y="529">다시 사용할 작업 순서</text><text x="848" y="529">기록된 지식 활용 관계</text></g>
<path d="M54 597 H1146" stroke="#d4dbd0"/>
<text x="54" y="628" font-size="17">사람은 근거를 확인하고, 에이전트는 같은 타입 계약을 읽습니다.</text>
<text x="54" y="652" font-size="13" fill="#64746c">합성 예시 · 활용 관계는 기록된 경우에만 표시 · 파일 기반의 결정적 private projection</text>
