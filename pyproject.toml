[project]
name = "llm-wiki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pymupdf>=1.24.0",
    "markdownify>=0.12.0",
    "httpx>=0.27.0",
    "python-frontmatter>=1.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "anthropic>=0.40.0",
    "networkx>=3.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
